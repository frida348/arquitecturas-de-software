<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Error</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-gray-100">
        <div class="container mx-auto my-8 p-4 bg-white rounded shadow-md">
            <h1 class="text-3xl font-bold text-center mb-4 text-red-500">¡Ocurrió un error!</h1>
            <p class="text-center text-lg text-gray-700 mb-6" th:text="${error}">Error Message</p>
            <div class="text-center">
                <a href="/mascotas" class="bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600">
                    Regresar a la lista de mascotas
                </a>
            </div>
        </div>
    </body>
</html>
