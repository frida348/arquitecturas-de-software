<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://cdn.tailwindcss.com"></script>
        <title>Lista de Mascotas</title>
    </head>
    <body class="bg-gray-100">
        <div class="container mx-auto my-8">
            <!-- Formulario para poder eliminar múltiples mascotas al mismo tiempo -->
            <form th:action="@{/mascotas/eliminar-multiples}" method="post" 
            onsubmit="return confirm('¿Estás seguro de eliminar las mascotas seleccionadas?');">
                <!-- Título y botones -->
                <div class="flex mb-8 w-auto">
                    <h1 class="text-6xl font-bold self-center pl-8">CRUD de Mascotas</h1>
                    
                    <button type="button" onclick="location.href = '/mascotas/nuevo'" class="ml-auto mr-4 bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600">
                        Agregar Nueva Mascota
                    </button>
                    
                    <button type="submit" class="mr-8 bg-red-500 text-white py-2 px-4 rounded hover:bg-red-600">
                        Eliminar Seleccionadas
                    </button>
                </div>
                
                <!-- Tabla con la información de la base de datos -->
                <table class="table-auto w-full bg-white rounded-lg shadow-md overflow-hidden">
                    <thead>
                        <tr class="bg-gray-200 text-gray-700">
                            <th class="p-4 text-left"></th>
                            <th class="p-4 text-left">ID</th>
                            <th class="p-4 text-left">Imagen</th>
                            <th class="p-4 text-left">Nombre</th>
                            <th class="p-4 text-left">Edad</th>
                            <th class="p-4 text-left">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="mascota : ${mascotas}" class="border-b hover:bg-gray-100">
                            <td class="p-4">
                                <input type="checkbox" name="mascotasIds" th:value="${mascota.id}" />
                            </td>
                            <td class="p-4" th:text="${mascota.id}">ID</td>
                            <td class="p-4">
                                <img th:src="${mascota.urlImagen}" alt="Imagen de la mascota" class="w-16 h-16 object-cover rounded-md">
                            </td>
                            <td class="p-4" th:text="${mascota.nombre}">Nombre</td>
                            <td class="p-4" th:text="${mascota.edad}">Edad</td>
                            <td class="p-4">
                                <a th:href="@{'/mascotas/editar/' + ${mascota.id}}" 
                                   class="text-blue-500 hover:text-blue-700">Editar</a>
                                <br>
                                <a th:href="@{'/mascotas/eliminar/' + ${mascota.id}}" 
                                   class="text-red-500 hover:text-red-700">Eliminar</a>
                            </td>
                        </tr>
                    </tbody>
                </table>

            </form>
        </div>
    </body>
</html>
